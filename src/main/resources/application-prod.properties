# work_mem for the MIS pool only — the pool every Jasper report borrows from, and
# nothing else (all ~190 consumers are getConnectionForReportMis). Applied as a
# connectionInitSql, so it runs once per physical connection rather than per report.
# Blank or absent leaves the server default (4MB) untouched. The main OLTP pool is
# deliberately not given this.
#
# SIZING: work_mem is per sort/hash NODE per connection, not per query. A register
# with a DISTINCT plus an ORDER BY plus hash joins can hold several multiples at
# once. Worst case here is roughly
#     jdbc.pool.maxTotal (15) x nodes-per-plan x 32MB
# of backend memory on the database server. Check the real node count with
# EXPLAIN (ANALYZE, BUFFERS) before raising this further, and confirm the DB host
# has the headroom — on the testing server that instance is shared.
jdbc.mis.workMem=16MB


###############  JDBC connection pool  ########################
# Each setting resolves most-specific first:
#     jdbc.pool.<name>       -> this app's MAIN pool only
#     jdbc.mis.pool.<name>   -> this app's MIS (reporting) pool only
#     ...falling back to jdbc.pool.<name>, then to the built-in default.
#
# Previously jdbc.pool.maxTotal sized every pool in both applications at once,
# which made it impossible to give the reporting pool a different budget from
# the OLTP one. That key still works and still applies to any pool without its
# own override, so nothing here has to be set for the app to behave as before.
#
# Built-in defaults for MMUWeb: main=20, mis=10.
# The startup line prints the effective value and which key supplied it:
#     [MMUWeb-main] pooled DataSource ready: maxTotal=20 (from built-in default 20), ...
#
# Names: maxTotal, maxIdle, minIdle, initialSize, maxWaitMillis,
#        evictionRunMillis, removeAbandonedTimeoutSeconds, logAbandoned
#
# Keep the sum of all pools below the server's max_connections, and do not let
# a Tomcat connector's maxThreads exceed the pool it depends on.
#jdbc.pool.maxTotal=20
#jdbc.mis.pool.maxTotal=10

#<!-- hibernate c3p0 connection pooling configuration  -->

#Determines how many connections at a time c3p0 will try to acquire when the pool is exhausted.
hibernate.c3p0.acquire_increment=1
#Minimum number of JDBC connections in the pool. Hibernate default: 1
hibernate.c3p0.min_size=5
#Maximum number of JDBC connections in the pool. Hibernate default: 100
hibernate.c3p0.max_size=100
#When an idle connection is removed from the pool (in second). Hibernate default: 0, never expire.
hibernate.c3p0.timeout=0
#Number of prepared statements will be cached. Increase performance. Hibernate default: 0 , caching is disable.
hibernate.c3p0.max_statements=50
#idle time in seconds before a connection is automatically validated.(in second) Hibernate default: 0
hibernate.c3p0.idle_test_period=60
#Defines how many times c3p0 will try to acquire a new Connection from the database before giving up. If this value is less than or equal to zero, c3p0 will keep trying to fetch a Connection indefinitely.
hibernate.c3p0.acquireRetryAttempts=1
# Milliseconds, time c3p0 will wait between acquire attempts.
hibernate.c3p0.acquireRetryDelay=250

spring.jackson.serialization.fail-on-empty-beans=false


